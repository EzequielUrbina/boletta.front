<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 526" width="440" height="526" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2B66"/>
      <stop offset="55%" stop-color="#18245A"/>
      <stop offset="100%" stop-color="#121C4A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#F28C4B"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0F2A6B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C3E84"/>
      <stop offset="100%" stop-color="#1A2A66"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6EEFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFD35C"/>
      <stop offset="100%" stop-color="#FFF4C2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050A20" flood-opacity="0.45"/>
    </filter>
    <filter id="flowerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#050A20" flood-opacity="0.4"/>
    </filter>
    <!-- Pétalo de sacuanjoche (apunta hacia arriba desde el centro) -->
    <path id="petalShape" d="M0 0 C -15 -10, -18 -34, 0 -50 C 18 -34, 15 -10, 0 0 Z"/>
  </defs>

  <!-- Cielo -->
  <rect width="440" height="526" fill="url(#sky)"/>

  <!-- Sol -->
  <circle cx="318" cy="150" r="74" fill="#FFC857" fill-opacity="0.12"/>
  <circle cx="318" cy="150" r="48" fill="url(#sun)"/>

  <!-- Volcanes (Mombacho a la izquierda, Momotombo a la derecha) -->
  <path d="M-10 330 L95 210 Q110 200 125 210 L200 300 L230 330 Z" fill="url(#mountain)"/>
  <path d="M120 330 L230 200 Q245 188 260 200 L300 245 L340 290 L380 330 Z" fill="#22347A"/>
  <path d="M236 204 Q248 196 258 204 L252 212 Q246 208 242 212 Z" fill="#162556"/>
  <path d="M300 245 L330 280 L345 330 L300 330 Z" fill="#1F2F72" fill-opacity="0.7"/>

  <!-- Lago Cocibolca -->
  <rect x="0" y="330" width="440" height="196" fill="url(#lake)"/>
  <g stroke="#8FB3FF" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="360" x2="150" y2="360"/>
    <line x1="190" y1="378" x2="290" y2="378"/>
    <line x1="110" y1="402" x2="210" y2="402"/>
    <line x1="260" y1="420" x2="370" y2="420"/>
  </g>

  <!-- Boleta de calificaciones -->
  <g transform="rotate(-3 220 230)" filter="url(#shadow)">
    <rect x="120" y="180" width="200" height="176" rx="14" fill="url(#card)"/>
    <rect x="120" y="180" width="200" height="40" rx="14" fill="url(#accent)"/>
    <rect x="120" y="200" width="200" height="20" fill="url(#accent)"/>
    <rect x="140" y="193" width="90" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="140" y="206" width="60" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.6"/>

    <g>
      <rect x="140" y="236" width="100" height="7" rx="3.5" fill="#94A3C6"/>
      <rect x="272" y="230" width="38" height="19" rx="6" fill="#22C55E"/>
      <text x="291" y="244" font-family="Nunito, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">AA</text>
    </g>
    <g>
      <rect x="140" y="262" width="82" height="7" rx="3.5" fill="#94A3C6"/>
      <rect x="272" y="256" width="38" height="19" rx="6" fill="#2563EB"/>
      <text x="291" y="270" font-family="Nunito, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">AS</text>
    </g>
    <g>
      <rect x="140" y="288" width="112" height="7" rx="3.5" fill="#94A3C6"/>
      <rect x="272" y="282" width="38" height="19" rx="6" fill="#F59E0B"/>
      <text x="291" y="296" font-family="Nunito, Arial, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">AF</text>
    </g>
    <line x1="140" y1="316" x2="310" y2="316" stroke="#C7D3EE" stroke-width="1.5"/>
    <text x="140" y="340" font-family="Nunito, Arial, sans-serif" font-size="11" fill="#5B6B93">Boletín de calificaciones</text>
  </g>

  <!-- Hojas verdes de sacuanjoche -->
  <g fill="#2FA37A" filter="url(#flowerShadow)">
    <ellipse cx="0" cy="0" rx="6" ry="18" transform="translate(150 196) rotate(-55)"/>
    <ellipse cx="0" cy="0" rx="6" ry="18" transform="translate(150 196) rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="6" ry="18" transform="translate(150 196) rotate(25)"/>
  </g>

  <!-- Flor de sacuanjoche (flor nacional de Nicaragua) -->
  <g transform="translate(150 178) scale(0.95)" filter="url(#flowerShadow)">
    <use href="#petalShape" fill="url(#petal)" transform="rotate(0)"/>
    <use href="#petalShape" fill="url(#petal)" transform="rotate(72)"/>
    <use href="#petalShape" fill="url(#petal)" transform="rotate(144)"/>
    <use href="#petalShape" fill="url(#petal)" transform="rotate(216)"/>
    <use href="#petalShape" fill="url(#petal)" transform="rotate(288)"/>
    <!-- Vetas internas de cada pétalo -->
    <g stroke="#F2B233" stroke-width="1.3" stroke-linecap="round" fill="none" stroke-opacity="0.7">
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(0)"/>
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(72)"/>
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(144)"/>
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(216)"/>
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(288)"/>
    </g>
    <!-- Centro -->
    <circle cx="0" cy="0" r="8" fill="#F28C1E"/>
    <circle cx="0" cy="0" r="4" fill="#E06C12"/>
  </g>

  <!-- Estrellas -->
  <g fill="#FFFFFF" fill-opacity="0.7">
    <path d="M60 70 L62 76 L68 78 L62 80 L60 86 L58 80 L52 78 L58 76 Z"/>
    <circle cx="390" cy="60" r="2.2"/>
    <circle cx="40" cy="150" r="1.8"/>
    <circle cx="400" cy="250" r="1.6"/>
    <circle cx="120" cy="50" r="1.6"/>
  </g>
</svg>
