<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2B66"/>
      <stop offset="60%" stop-color="#18245A"/>
      <stop offset="100%" stop-color="#121C4A"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#F28C4B"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0F2A6B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C3E84"/>
      <stop offset="100%" stop-color="#1A2A66"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6EEFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFD35C"/>
      <stop offset="100%" stop-color="#FFF4C2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#050A20" flood-opacity="0.45"/>
    </filter>
    <path id="petalShape" d="M0 0 C -15 -10, -18 -34, 0 -50 C 18 -34, 15 -10, 0 0 Z"/>
  </defs>

  <!-- Cielo -->
  <rect width="400" height="220" fill="url(#sky)"/>

  <!-- Sol -->
  <circle cx="316" cy="62" r="52" fill="#FFC857" fill-opacity="0.12"/>
  <circle cx="316" cy="62" r="34" fill="url(#sun)"/>

  <!-- Volcanes -->
  <path d="M-10 140 L70 80 Q82 72 96 80 L150 130 L170 140 Z" fill="url(#mountain)"/>
  <path d="M120 140 L200 70 Q212 60 226 70 L262 104 L300 140 Z" fill="#22347A"/>

  <!-- Lago -->
  <rect x="0" y="140" width="400" height="80" fill="url(#lake)"/>
  <g stroke="#8FB3FF" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round">
    <line x1="230" y1="160" x2="330" y2="160"/>
    <line x1="260" y1="182" x2="370" y2="182"/>
  </g>

  <!-- Flor de sacuanjoche -->
  <g transform="translate(120 84) scale(0.78)">
    <g fill="#2FA37A">
      <ellipse cx="0" cy="0" rx="6" ry="18" transform="translate(0 6) rotate(-55)"/>
      <ellipse cx="0" cy="0" rx="6" ry="18" transform="translate(0 6) rotate(-15)"/>
      <ellipse cx="0" cy="0" rx="6" ry="18" transform="translate(0 6) rotate(25)"/>
    </g>
    <use href="#petalShape" fill="url(#petal)"/>
    <use href="#petalShape" fill="url(#petal)" transform="rotate(72)"/>
    <use href="#petalShape" fill="url(#petal)" transform="rotate(144)"/>
    <use href="#petalShape" fill="url(#petal)" transform="rotate(216)"/>
    <use href="#petalShape" fill="url(#petal)" transform="rotate(288)"/>
    <g stroke="#F2B233" stroke-width="1.3" stroke-linecap="round" fill="none" stroke-opacity="0.7">
      <path d="M0 -6 Q -2 -22 0 -36"/>
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(72)"/>
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(144)"/>
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(216)"/>
      <path d="M0 -6 Q -2 -22 0 -36" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="#F28C1E"/>
    <circle cx="0" cy="0" r="4" fill="#E06C12"/>
  </g>

  <!-- Boleta pequeña a la derecha, por encima del lago -->
  <g transform="rotate(-4 250 110)" filter="url(#shadow)">
    <rect x="200" y="62" width="110" height="92" rx="9" fill="url(#card)"/>
    <rect x="200" y="62" width="110" height="24" rx="9" fill="url(#accent)"/>
    <rect x="200" y="74" width="110" height="12" fill="url(#accent)"/>
    <rect x="214" y="69" width="50" height="5" rx="2.5" fill="#FFFFFF"/>
    <rect x="214" y="98" width="52" height="5" rx="2.5" fill="#94A3C6"/>
    <rect x="276" y="94" width="26" height="12" rx="4" fill="#22C55E"/>
    <text x="289" y="103" font-family="Nunito, Arial, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">AA</text>
    <rect x="214" y="116" width="44" height="5" rx="2.5" fill="#94A3C6"/>
    <rect x="276" y="112" width="26" height="12" rx="4" fill="#2563EB"/>
    <text x="289" y="121" font-family="Nunito, Arial, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">AS</text>
    <rect x="214" y="134" width="48" height="5" rx="2.5" fill="#94A3C6"/>
    <rect x="276" y="130" width="26" height="12" rx="4" fill="#F59E0B"/>
    <text x="289" y="139" font-family="Nunito, Arial, sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">AF</text>
  </g>

  <!-- Estrellas -->
  <g fill="#FFFFFF" fill-opacity="0.7">
    <path d="M40 30 L42 36 L48 38 L42 40 L40 46 L38 40 L32 38 L38 36 Z"/>
    <circle cx="170" cy="22" r="1.8"/>
    <circle cx="368" cy="20" r="2"/>
    <circle cx="90" cy="60" r="1.5"/>
  </g>
</svg>
